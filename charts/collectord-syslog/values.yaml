# Only in case of OpenShift
scc:
  create: true
  name: ""

collectord:
  image:
    repository: registry.outcold.solutions/outcoldsolutions/collectorforkubernetes

  clusterRole:
    name: ""
    create: true
    userOutputSecrets: false

  configuration:
    general:
      # IMPORTANT: Please review license https://www.outcoldsolutions.com/legal/license-agreement/
      # and accept license by changing the value to *true*
      acceptLicense: false
      license: ""
      dataPath: "./data/"
      logLevel: info
      httpServerBinding: ""
      httpServerLog: false
      telemetryEndpoint: "https://license.outcold.solutions/telemetry/"
      licenseEndpoint: "https://license.outcold.solutions/license/"
      licenseServerProxyUrl: ""
      licenseServerProxyBasicAuth: ""
      hostname: ""
      defaultOutput: "syslog"
      fileInputBufferSize: "8kb"
      fileInputLineMaxSize: "1mb"
      fields:
        cluster: "-"
      ec2Metadata: {}
      annotationsSubdomain: "syslog"
      thruputPerSecond: ""
      tooOldEvents: ""
      tooNewEvents: ""
      fieldsSeparator: ""
      autoSkipGzipFiles: true
      "multioutput.async": true
      "multioutput.asyncBufferSize": 100
      kubernetes:
        serviceURL: ""
        nodeName: ""
        tokenPath: /var/run/secrets/kubernetes.io/serviceaccount/token
        certPath: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        timeout: 30m
        metadataTTL: 30s
        volumesRootDir: /rootfs/var/lib/kubelet/
        includeAnnotations: []
        excludeLabels: []
        watch:
          - 'v1/namespace'
          - 'apps/v1/deployment'
          - 'collectord.io/v1/configuration'
      crio:
        url: unix:///rootfs/var/run/crio/crio.sock
        timeout: 1m
      containerd:
        runtimePath: /rootfs/var/run/containerd
        namespace: k8s.io
    licenseClient:
      url: ""
      basicAuth: ""
      insecure: false
      capath: ""
      caname: ""
      proxyUrl: ""
      proxyBasicAuth: ""
    pipeJoin:
      disabled: false
      maxInterval: 100ms
      maxWait: 1s
      maxSize: 1MB
      patternRegex: '^[^\s]'
    pipeReplace: []
    pipeHash: []
    # Log lines no thruput cap holds back and no sampling drops, per workload; over a spent cap
    # a selected workload drops its other lines. Select by kubernetes_namespace: pod, container
    # and image names are the workload owner's to choose.
    # - name: payments-audit
    #   patternRegex: '^AUDIT'
    #   matchRegex:
    #     kubernetes_namespace: '^payments$'
    pipeThruputExempt: []
    pipeEventCount:
      disabled: true
      labels: []
      fields: []
      maxSeries: 0
    
    outputs:
      syslog:
        default: 
          network: "tcp"
          address: ""

    inputs:
      containerLogs:
        disabled: false
        type: "k8s_logs"
        "syslog.format": '{{type}}|{{timestamp::format(2006-01-02T15:04:05.999999999Z07:00)}}|{{cluster}}|{{host}}|{{namespace}}|{{pod_id}}|{{pod_name}}|{{container_name}}|{{stream}}|{{message}}'
        path: "/rootfs/var/lib/docker/containers/"
        crioPath: "/rootfs/var/log/pods/"
        pollingInterval: 250ms
        walkingInterval: 5s
        verboseFields: false
        joinPartialEvents: true
        stripTerminalEscapeSequences: false
        stripTerminalEscapeSequencesRegex: '(\x1b\[\d{1,3}(;\d{1,3})*m)|(\x07)|(\x1b]\d+(\s\d)?;[^\x07]+\x07)|(.*\x1b\[K)'
        samplingPercent: -1
        samplingKey: ""
        output: ""
        thruputPerSecond: ""
        tooOldEvents: ""
        tooNewEvents: ""
        # Read rotated logs the kubelet compressed before Collectord got to them; false counts them lost.
        readCompressed: true
        compressedInflateBudget: 256MiB
        # Repeat grouping, folding (lossy) and pattern reports: off unless true here or in a
        # workload's logs-repeat/fold/patterns-enabled annotation.
        repeatEnabled: false
        foldEnabled: false
        patternsEnabled: false
        
      applicationLogs:
        disabled: false
        root: /rootfs/
        syncInterval: 5s
        glob: "*.log*"
        pollingInterval: 250ms
        walkingInterval: 5s
        verboseFields: false
        type: "k8s_logs"
        "syslog.format": '{{type}}|{{timestamp::format(2006-01-02T15:04:05.999999999Z07:00)}}|{{cluster}}|{{host}}|{{namespace}}|{{pod_id}}|{{pod_name}}|{{container_name}}|{{file_name}}|{{message}}'
        eventPatternRegex: '^[^\s]'
        eventPatternMaxInterval: 100ms
        eventPatternMaxWait: 1s
        eventPatternMaxSize: 1MB
        samplingPercent: -1
        samplingKey: ""
        output: ""
        thruputPerSecond: ""
        tooOldEvents: ""
        tooNewEvents: ""
        maxHoldAfterClose: 1800s
        repeatEnabled: false
        foldEnabled: false
        patternsEnabled: false
      
      hostLogs:
        "audit-logs":
          disabled: false
          controlPlaneOnly: true
          path: '/rootfs/var/log/kube-apiserver/'
          glob: 'audit*.log'
          match: ""
          recursive: false
          pollingInterval: 250ms
          walkingInterval: 5s
          verboseFields: false
          type: "k8s_audit_logs"
          "syslog.format": '{{type}}|{{timestamp::format(2006-01-02T15:04:05.999999999Z07:00)}}|{{cluster}}|{{message}}'
          extraction: '(?P<message>.*"stageTimestamp":"(?P<timestamp>[^"]+)".*)'
          extractionMessageField: 'message'
          timestampField: 'timestamp'
          timestampFormat: '2006-01-02T15:04:05.999999999Z07:00'
          timestampLocation: ""
          samplingPercent: -1
          samplingKey: ""
          output: ""
          thruputPerSecond: ""
          tooOldEvents: ""
          tooNewEvents: ""
          eventPattern: ""
          blacklist: []
          whitelist: []
          thruputExempt: []
          repeatEnabled: false
          foldEnabled: false
          patternsEnabled: false
        # Off: rsyslog writes these files from the journal journald reads, so lines would arrive
        # twice. On nodes without journald, turn this on and journald off.
        "syslog":
          disabled: true
          path: '/rootfs/var/log/'
          glob: ""
          match: '^(syslog|messages|auth\.log)(.[\d\-]+)?$'
          recursive: false
          pollingInterval: 250ms
          walkingInterval: 5s
          verboseFields: false
          type: "k8s_host_logs"
          "syslog.format": '{{type}}|{{timestamp::format(2006-01-02T15:04:05.999999999Z07:00)}}|{{cluster}}|{{host}}|{{file_name}}|{{message}}'
          extraction: '^(?P<timestamp>[A-Za-z]+\s+\d+\s\d+:\d+:\d+|\d{4}-\d{2}-\d{2}T\S+)\s(?P<syslog_hostname>[^\s]+)\s(?P<syslog_component>[^:\[]+)(\[(?P<syslog_pid>\d+)\])?: (.+)$'
          extractionMessageField: ""
          # the fields naming the process that wrote a line, which groups its lines apart
          extractionWriterFields: "syslog_hostname, syslog_component, syslog_pid"
          timestampField: "timestamp"
          # RFC 3339 or the traditional `Jan 2 15:04:05`
          timestampFormat: "@syslog"
          timestampSetMonth: false
          timestampSetDay: false
          timestampLocation: "Local"
          samplingPercent: -1
          samplingKey: ""
          output: ""
          thruputPerSecond: ""
          tooOldEvents: ""
          tooNewEvents: ""
          eventPattern: ""
          blacklist: []
          whitelist: []
          thruputExempt: []
          repeatEnabled: false
          foldEnabled: false
          patternsEnabled: false
        "logs":
          disabled: false
          path: '/rootfs/var/log/'
          glob: ""
          match: '^(([\w\-.]+\.log(.[\d\-]+)?)|(docker))$'
          # the files rsyslog writes from the journal on Debian and Ubuntu, which journald reads
          exclude: '^(auth|cron|daemon|kern|lpr|mail|user|ufw)\.log(.[\d\-]+)?$'
          pollingInterval: 250ms
          walkingInterval: 5s
          verboseFields: false
          type: "k8s_host_logs"
          "syslog.format": '{{type}}|{{timestamp::format(2006-01-02T15:04:05.999999999Z07:00)}}|{{cluster}}|{{host}}|{{file_name}}|{{message}}'
          extraction: ''
          extractionMessageField: ""
          timestampField: ""
          timestampFormat: ""
          timestampLocation: ""
          samplingPercent: -1
          samplingKey: ""
          output: ""
          thruputPerSecond: ""
          tooOldEvents: ""
          tooNewEvents: ""
          eventPattern: ""
          blacklist: []
          whitelist: []
          thruputExempt: []
          repeatEnabled: false
          foldEnabled: false
          patternsEnabled: false
      
      journald:
        disabled: false
        path:
          persistent: /rootfs/var/log/journal/
          volatile: /rootfs/run/log/journal/
        pollingInterval: 250ms
        startFromRel: ""
        type: "k8s_host_logs"
        "syslog.format": '{{type}}|{{timestamp::format(2006-01-02T15:04:05.999999999Z07:00)}}|{{cluster}}|{{host}}|journald|{{message}}'
        samplingPercent: -1
        samplingKey: ""
        reopenInterval: 1h
        output: ""
        thruputPerSecond: ""
        tooOldEvents: ""
        tooNewEvents: ""
        eventPattern: '^[^\s]'
        blacklist: []
        whitelist: []
        thruputExempt: []
        spawnExternalProcess: false
        repeatEnabled: false
        foldEnabled: false
        patternsEnabled: false
        
      # Scripts run on every node, their output sent as events: each entry is an
      # [input.script::<name>] stanza (quote arg.<n> and env.<n>). root: /rootfs runs it with the
      # node's shell and tools. A script runs only when root owns it and every directory above it,
      # writable by no one else.
      scripts: {}
        # uptime:
        #   command: /opt/scripts/uptime.sh
        #   "arg.1": "--pretty"
        #   "env.1": "TZ=UTC"
        #   root: /rootfs
        #   user: nobody
        #   interval: 5m
        #   timeout: 60s
        #   format: event
        #   type: kubernetes_uptime

      kubernetesEvents:
        disabled: false
        type: "k8s_events"
        "syslog.format": '{{type}}|{{timestamp::format(2006-01-02T15:04:05.999999999Z07:00)}}|{{cluster}}|{{message}}'
        output: ""
        excludeManagedFields: true
      
