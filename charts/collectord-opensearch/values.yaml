# Only in case of OpenShift
scc:
  create: true
  name: ""
  
collectord:
  image:
    repository: registry.outcold.solutions/outcoldsolutions/collectorforkubernetes
  
  clusterRole:
    name: ""
    create: true
    userOutputSecrets: false
    
  configMap:
    allAdditionalFiles:
      "es-default-index-template.json": |
        {
          "version": 1,
          "data_stream": {},
          "_meta": {
            "description": "Default template for Collectord indexes"
          },
          "priority": 500,
          "template": {
            "settings": {
              "index": {
                "refresh_interval": "5s",
                "mapping": {
                  "total_fields": {
                    "limit": "10000"
                  }
                },
                "max_docvalue_fields_search": "200"
              },
              "query": {
                "default_field": [
                  "message",
                  "container.name",
                  "container.image.name",
                  "host.name",
                  "orchestrator.namespace",
                  "orchestrator.cluster.name",
                  "container.name",
                  "kubernetes.pod.name",
                  "kubernetes.pod.id",
                  "kubernetes.pod.ip",
                  "kubernetes.namespace.name",
                  "kubernetes.node.name",
                  "kubernetes.cluster.name",
                  "kubernetes.replicaset.name",
                  "kubernetes.deployment.name",
                  "kubernetes.statefulset.name",
                  "kubernetes.daemonset.name",
                  "kubernetes.job.name",
                  "kubernetes.cronjob.name"
                ]
              }
            },
            "mappings": {
              "dynamic_templates": [
                {
                  "kubernetes.pod.labels.*": {
                    "path_match": "kubernetes.pod.labels.*",
                    "mapping": {  "type": "keyword" },
                    "match_mapping_type": "*"
                  }
                },
                {
                  "kubernetes.namespace.labels.*": {
                    "path_match": "kubernetes.namespace.labels.*",
                    "mapping": { "type": "keyword" },
                    "match_mapping_type": "*"
                  }
                },
                {
                  "kubernetes.node.labels.*": {
                    "path_match": "kubernetes.node.labels.*",
                    "mapping": { "type": "keyword" },
                    "match_mapping_type": "*"
                  }
                },
                {
                  "kubernetes.daemonset.labels.*": {
                    "path_match": "kubernetes.daemonset.labels.*",
                    "mapping": { "type": "keyword" },
                    "match_mapping_type": "*"
                  }
                },
                {
                  "kubernetes.replicaset.labels.*": {
                    "path_match": "kubernetes.replicaset.labels.*",
                    "mapping": { "type": "keyword" },
                    "match_mapping_type": "*"
                  }
                },
                {
                  "kubernetes.deployment.labels.*": {
                    "path_match": "kubernetes.deployment.labels.*",
                    "mapping": { "type": "keyword" },
                    "match_mapping_type": "*"
                  }
                },
                {
                  "kubernetes.statefulset.labels.*": {
                    "path_match": "kubernetes.statefulset.labels.*",
                    "mapping": { "type": "keyword" },
                    "match_mapping_type": "*"
                  }
                },
                {
                  "kubernetes.job.labels.*": {
                    "path_match": "kubernetes.job.labels.*",
                    "mapping": { "type": "keyword" },
                    "match_mapping_type": "*"
                  }
                },
                {
                  "kubernetes.cronjob.labels.*": {
                    "path_match": "kubernetes.cronjob.labels.*",
                    "mapping": { "type": "keyword" },
                    "match_mapping_type": "*"
                  }
                },
                {
                  "strings_as_keyword": {
                    "mapping": { "ignore_above": 1024, "type": "keyword" },
                    "match_mapping_type": "string"
                  }
                }
              ],
              "properties": {
                "@timestamp": { "type": "date"},
                "message": {"type":"text"},
                "collectord_errors": {"type": "keyword","ignore_above": 1024},
                "collectord_repeat_count": {"type": "long"},
                "collectord_repeat_span": {"type": "long"},
                "collectord_repeat_offsets": {"type": "long"},
                "collectord_fold_count": {"type": "long"},
                "collectord_fold_bytes": {"type": "long"},
                "collectord_pattern_lines": {"type": "long"},
                "collectord_pattern_bytes": {"type": "long"},
                "collectord_pattern_seconds": {"type": "long"},
                "collectord": {"properties": {
                  "repeat": {"properties": {
                    "count": {"type": "long"},
                    "span": {"type": "long"},
                    "offsets": {"type": "long"}
                  }},
                  "fold": {"properties": {
                    "count": {"type": "long"},
                    "bytes": {"type": "long"}
                  }},
                  "pattern": {"properties": {
                    "lines": {"type": "long"},
                    "bytes": {"type": "long"},
                    "seconds": {"type": "long"}
                  }}
                }},
                "input":{"properties":{"type":{"ignore_above":1024,"type":"keyword"}}},
                "container": {"properties": {
                  "name": { "ignore_above": 1024, "type": "keyword"},
                  "id": { "ignore_above": 1024, "type": "keyword"},
                  "runtime": {"ignore_above": 1024, "type": "keyword"},
                  "image": {"properties": {
                    "name": { "ignore_above": 1024, "type": "keyword"}
                  }}
                }
                },
                "event": {"properties": {
                  "id": {"ignore_above": 1024, "type": "keyword"}
                }},
                "host": {"properties": {
                  "name": {"ignore_above": 1024, "type": "keyword"},
                  "architecture": {"ignore_above": 1024, "type": "keyword"},
                  "hostname": {"ignore_above": 1024, "type": "keyword"}
                }},
                "log": { "properties": {
                  "file": { "properties": {
                    "path": {"ignore_above": 1024, "type": "keyword"}
                  }},
                  "offset": {"type": "long"},
                  "syslog": {"properties": {
                    "appname": {"ignore_above": 1024, "type": "keyword"},
                    "facility": {"properties": {
                      "code": {"type": "long"}
                    }},
                    "priority": {"type": "long"},
                    "procid": {"type": "long"},
                    "hostname": {"ignore_above": 1024, "type": "keyword"}
                  }}
                }},
                "orchestrator": {"properties": {
                  "cluster": {"properties": {
                    "name": {"ignore_above": 1024, "type": "keyword"}
                  }},
                  "namespace": {"properties": {
                    "name":{"path":"kubernetes.namespace.name","type":"alias"}
                  }},
                  "type": {"ignore_above": 1024, "type": "keyword"}
                }},
                "stream": {"ignore_above": 1024, "type": "keyword"},
                "agent":{"properties":{
                  "hostname":{"path":"agent.name","type":"alias"},
                  "name":{"ignore_above":1024,"type":"keyword"},
                  "id":{"ignore_above":1024,"type":"keyword"},
                  "type":{"ignore_above":1024,"type":"keyword"},
                  "ephemeral_id":{"ignore_above":1024,"type":"keyword"},
                  "version":{"ignore_above":1024,"type":"keyword"}
                }},
                "ecs":{"properties":{"version":{"ignore_above":1024,"type":"keyword"}}},
                "kubernetes": { "properties": {
                  "container": {"properties": {
                    "imageid": {"ignore_above": 1024, "type": "keyword"}
                  }},
                  "host": {"properties": {
                    "ip": {"type": "ip"}
                  }},
                  "namespace": {"properties": {
                    "name": {"ignore_above": 1024, "type": "keyword"}
                  }},
                  "node": { "properties": {
                    "id": {"ignore_above": 1024, "type": "keyword"},
                    "name": {"ignore_above": 1024,"type": "keyword"}
                  }},
                  "pod": {"properties": {
                    "id": {"ignore_above": 1024,"type": "keyword"},
                    "ip": {"type": "ip"},
                    "name": {"ignore_above": 1024,"type": "keyword"}
                  }},
                  "statefulset": { "properties": {
                    "id": {"ignore_above": 1024,"type": "keyword"},
                    "name": {"ignore_above": 1024,"type": "keyword"}
                  }},
                  "replicaset": {"properties": {
                    "id": {"ignore_above": 1024,"type": "keyword"},
                    "name": {"ignore_above": 1024, "type": "keyword"}
                  }},
                  "deployment": { "properties": {
                    "id": {"ignore_above": 1024,"type": "keyword"},
                    "name": {"ignore_above": 1024,"type": "keyword" }
                  }},
                  "cronjob": {"properties": {
                    "id": {"ignore_above": 1024,"type": "keyword"},
                    "name": {"ignore_above": 1024, "type": "keyword"}
                  }},
                  "job": {"properties": {
                    "id": {"ignore_above": 1024,"type": "keyword"},
                    "name": {"ignore_above": 1024, "type": "keyword"}
                  }}
                }},
                "volume": {"properties": {
                    "name": {"ignore_above": 1024,"type": "keyword"}
                }}
              }
            }
          },
          "index_patterns": ["logs-collectord-${COLLECTORD_VERSION}"]
        }
      "es-failed-index-template.json": |
        {
          "version": 1,
          "data_stream": {},
          "_meta": {
            "description": "Default template for Collectord indexes for events that failed to be ingested"
          },
          "priority": 1000,
          "template": {
            "settings": {
              "index": {
                "refresh_interval": "5s",
                "mapping": {
                  "total_fields": {
                    "limit": "10000"
                  }
                },
                "max_docvalue_fields_search": "200"
              },
              "query": {
                "default_field": [
                  "message"
                ]
              }
            },
            "mappings": {
              "properties": {
                "@timestamp": {
                  "type": "date"},
                "message": {
                  "type": "text"}
              }
            }
          },
          "index_patterns": [
            "logs-collectord-failed-${COLLECTORD_VERSION}"]
        }


  # Liveness/readiness probes on /healthz and /readyz, at configuration.general's
  # httpServerBinding port; set httpGet.port when a configMap file sets the binding.
  daemonset:
    livenessProbe:
      httpGet:
        host: 127.0.0.1
        path: /healthz
      initialDelaySeconds: 120
      periodSeconds: 60
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        host: 127.0.0.1
        path: /readyz
      initialDelaySeconds: 10
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3

  deployment:
    livenessProbe:
      httpGet:
        path: /healthz
      initialDelaySeconds: 120
      periodSeconds: 60
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /readyz
      initialDelaySeconds: 10
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3

  configuration:
    general:
      # IMPORTANT: Please review license https://www.outcoldsolutions.com/legal/license-agreement/
      # and accept license by changing the value to *true*
      acceptLicense: false
      license: ""
      dataPath: "./data/"
      logLevel: info
      # Its own port: the other Collectord charts' DaemonSets on the host network use theirs.
      httpServerBinding: "127.0.0.1:11892"
      "httpServerEndpoints.health": true
      "httpServerEndpoints.ready": true
      "httpServerEndpoints.metrics": false
      "httpServerEndpoints.pprof": false
      httpServerLog: false
      telemetryEndpoint: "https://license.outcold.solutions/telemetry/"
      licenseEndpoint: "https://license.outcold.solutions/license/"
      licenseServerProxyUrl: ""
      licenseServerProxyBasicAuth: ""
      hostname: ""
      defaultOutput: "elasticsearch"
      fileInputBufferSize: "8kb"
      fileInputLineMaxSize: "1mb"
      fields:
        "ecs.version": "8.0.0"
        "orchestrator.cluster.name": "-"
        "orchestrator.type": "kubernetes"
        "agent.type": "collectord"
        "agent.version": "${COLLECTORD_VERSION}"
        "agent.ephemeral_id": "${COLLECTORD_INSTANCE_RUNTIME_ID}"
        "agent.id": "${COLLECTORD_INSTANCE_ID}"
        "agent.name": "${KUBERNETES_NODENAME}"
        "host.name": "${KUBERNETES_NODENAME}"
        "host.hostname": "${KUBERNETES_NODENAME}"
        "host.architecture": "${COLLECTORD_ARCH}"
      ec2Metadata: {}
      annotationsSubdomain: "opensearch"
      thruputPerSecond: ""
      tooOldEvents: ""
      tooNewEvents: ""
      fieldsSeparator: ""
      autoSkipGzipFiles: true
      "multioutput.async": true
      "multioutput.asyncBufferSize": 100
      kubernetes:
        serviceURL: ""
        nodeName: ""
        tokenPath: /var/run/secrets/kubernetes.io/serviceaccount/token
        certPath: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        timeout: 30m
        metadataTTL: 30s
        volumesRootDir: /rootfs/var/lib/kubelet/
        includeAnnotations: []
        excludeLabels: []
        watch:
          - 'v1/namespace'
          - 'apps/v1/deployment'
          - 'collectord.io/v1/configuration'
      crio:
        url: unix:///rootfs/var/run/crio/crio.sock
        timeout: 1m
      containerd:
        runtimePath: /rootfs/var/run/containerd
        namespace: k8s.io
    licenseClient:
      url: ""
      basicAuth: ""
      insecure: false
      capath: ""
      caname: ""
      proxyUrl: ""
      proxyBasicAuth: ""
    pipeJoin:
      disabled: false
      maxInterval: 100ms
      maxWait: 1s
      maxSize: 1MB
      patternRegex: '^[^\s]'
    pipeReplace: []
    pipeHash: []
    # Log lines no thruput cap holds back and no sampling drops, per workload; over a spent cap
    # a selected workload drops its other lines. Select by kubernetes_namespace: pod, container
    # and image names are the workload owner's to choose.
    # - name: payments-audit
    #   patternRegex: '^AUDIT'
    #   matchRegex:
    #     kubernetes_namespace: '^payments$'
    pipeThruputExempt: []
    pipeEventCount:
      disabled: true
      labels: []
      fields: []
      maxSeries: 0
    
    outputs:
      elasticsearch:
        default: 
          dataStream: 'logs-collectord-{{agent.version}}'
          dataStreamFailedEvents: 'logs-collectord-failed-{{agent.version}}'
          host: ""
          hosts: []
          hostSelection: "random"
          authorizationBasicUsername: ""
          authorizationBasicPassword: ""
          headers:
            "Content-Type": "application/json"
            "Accept": "application/json"
          insecure: false
          caPath: ""
          caName: ""
          clientCertPath: ""
          clientKeyPath: ""
          frequency: "5s"
          batchSize: "768K"
          events: "50"
          proxyUrl: ""
          proxyBasicAuth: ""
          timeout: "30s"
          compressionLevel: "default"
          threads: 2
          threadsAlgorithm: "weighted"
          put:
            "_index_template/logs-collectord-${COLLECTORD_VERSION}": "/config/es-default-index-template.json"
            "_index_template/logs-collectord-failed-${COLLECTORD_VERSION}": "/config/es-failed-index-template.json"
          queueSize: 1024

    inputs:
      containerLogs:
        disabled: false
        type: "container"
        path: "/rootfs/var/lib/docker/containers/"
        crioPath: "/rootfs/var/log/pods/"
        pollingInterval: 250ms
        walkingInterval: 5s
        verboseFields: false
        "elasticsearch.datastream": ""
        joinPartialEvents: true
        stripTerminalEscapeSequences: false
        stripTerminalEscapeSequencesRegex: '(\x1b\[\d{1,3}(;\d{1,3})*m)|(\x07)|(\x1b]\d+(\s\d)?;[^\x07]+\x07)|(.*\x1b\[K)'
        samplingPercent: -1
        samplingKey: ""
        output: ""
        thruputPerSecond: ""
        tooOldEvents: ""
        tooNewEvents: ""
        # Read rotated logs the kubelet compressed before Collectord got to them; false counts them lost.
        readCompressed: true
        compressedInflateBudget: 256MiB
        # Repeat grouping, folding (lossy) and pattern reports: off unless true here or in a
        # workload's logs-repeat/fold/patterns-enabled annotation.
        repeatEnabled: false
        foldEnabled: false
        patternsEnabled: false
        
      applicationLogs:
        disabled: false
        root: /rootfs/
        syncInterval: 5s
        glob: "*.log*"
        pollingInterval: 250ms
        walkingInterval: 5s
        verboseFields: false
        type: "container.file"
        "elasticsearch.datastream": ""
        eventPatternRegex: '^[^\s]'
        eventPatternMaxInterval: 100ms
        eventPatternMaxWait: 1s
        eventPatternMaxSize: 1MB
        samplingPercent: -1
        samplingKey: ""
        output: ""
        thruputPerSecond: ""
        tooOldEvents: ""
        tooNewEvents: ""
        maxHoldAfterClose: 1800s
        repeatEnabled: false
        foldEnabled: false
        patternsEnabled: false
      
      hostLogs:
        "audit-logs":
          disabled: false
          controlPlaneOnly: true
          path: '/rootfs/var/log/kube-apiserver/'
          glob: 'audit*.log'
          match: ""
          recursive: false
          pollingInterval: 250ms
          walkingInterval: 5s
          verboseFields: false
          type: "file"
          "elasticsearch.datastream": ""
          extraction: '(?P<message>.*"stageTimestamp":"(?P<timestamp>[^"]+)".*)'
          extractionMessageField: 'message'
          timestampField: 'timestamp'
          timestampFormat: '2006-01-02T15:04:05.999999999Z07:00'
          timestampLocation: ""
          samplingPercent: -1
          samplingKey: ""
          output: ""
          thruputPerSecond: ""
          tooOldEvents: ""
          tooNewEvents: ""
          eventPattern: ""
          blacklist: []
          whitelist: []
          thruputExempt: []
          repeatEnabled: false
          foldEnabled: false
          patternsEnabled: false
        # Off: rsyslog writes these files from the journal journald reads, so lines would arrive
        # twice. On nodes without journald, turn this on and journald off.
        "syslog":
          disabled: true
          path: '/rootfs/var/log/'
          glob: ""
          match: '^(syslog|messages|auth\.log)(.[\d\-]+)?$'
          recursive: false
          pollingInterval: 250ms
          walkingInterval: 5s
          verboseFields: false
          type: "file"
          "elasticsearch.datastream": ""
          extraction: '^(?P<timestamp>[A-Za-z]+\s+\d+\s\d+:\d+:\d+|\d{4}-\d{2}-\d{2}T\S+)\s(?P<log__syslog__hostname>[^\s]+)\s(?P<log__syslog__appname>[^:\[]+)(\[(?P<log__syslog__procid>\d+)\])?: (.+)$'
          extractionMessageField: ""
          # the fields naming the process that wrote a line, which groups its lines apart
          extractionWriterFields: "log__syslog__hostname, log__syslog__appname, log__syslog__procid"
          timestampField: "timestamp"
          # RFC 3339 or the traditional `Jan 2 15:04:05`
          timestampFormat: "@syslog"
          timestampSetMonth: false
          timestampSetDay: false
          timestampLocation: "Local"
          samplingPercent: -1
          samplingKey: ""
          output: ""
          thruputPerSecond: ""
          tooOldEvents: ""
          tooNewEvents: ""
          eventPattern: '^[^\s]'
          blacklist: []
          whitelist: []
          thruputExempt: []
          repeatEnabled: false
          foldEnabled: false
          patternsEnabled: false
        "logs":
          disabled: false
          path: '/rootfs/var/log/'
          glob: ""
          match: '^(([\w\-.]+\.log(.[\d\-]+)?)|(docker))$'
          # the files rsyslog writes from the journal on Debian and Ubuntu, which journald reads
          exclude: '^(auth|cron|daemon|kern|lpr|mail|user|ufw)\.log(.[\d\-]+)?$'
          recursive: false
          pollingInterval: 250ms
          walkingInterval: 5s
          verboseFields: false
          type: "file"
          "elasticsearch.datastream": ""
          extraction: ''
          extractionMessageField: ""
          timestampField: ""
          timestampFormat: ""
          timestampSetMonth: false
          timestampSetDay: false
          timestampLocation: ""
          samplingPercent: -1
          samplingKey: ""
          output: ""
          thruputPerSecond: ""
          tooOldEvents: ""
          tooNewEvents: ""
          eventPattern: '^[^\s]'
          blacklist: []
          whitelist: []
          thruputExempt: []
          repeatEnabled: false
          foldEnabled: false
          patternsEnabled: false
        
      
      journald:
        disabled: false
        path:
          persistent: /rootfs/var/log/journal/
          volatile: /rootfs/run/log/journal/
        pollingInterval: 250ms
        startFromRel: ""
        type: "journald"
        "elasticsearch.datastream": ""
        samplingPercent: -1
        samplingKey: ""
        reopenInterval: 1h
        output: ""
        thruputPerSecond: ""
        tooOldEvents: ""
        tooNewEvents: ""
        eventPattern: '^[^\s]'
        blacklist: []
        whitelist: []
        thruputExempt: []
        spawnExternalProcess: false
        repeatEnabled: false
        foldEnabled: false
        patternsEnabled: false
        
      # Scripts run on every node, their output sent as events: each entry is an
      # [input.script::<name>] stanza (quote arg.<n> and env.<n>). root: /rootfs runs it with the
      # node's shell and tools. A script runs only when root owns it and every directory above it,
      # writable by no one else.
      scripts: {}
        # uptime:
        #   command: /opt/scripts/uptime.sh
        #   "arg.1": "--pretty"
        #   "env.1": "TZ=UTC"
        #   root: /rootfs
        #   user: nobody
        #   interval: 5m
        #   timeout: 60s
        #   format: event
        #   type: kubernetes_uptime

      kubernetesEvents:
        disabled: false
        type: "events"
        "elasticsearch.datastream": ""
        output: ""
        excludeManagedFields: true
      kubernetesWatch:
        "pods":
          disabled: false
          refresh: 45m
          apiVersion: v1
          kind: Pod
          namespace: ""
          type: "objects"
          "elasticsearch.datastream": ""
          output: ""
          modifyValues: []
          excludeManagedFields: true
        "resourcequota":
          disabled: false
          refresh: 45m
          apiVersion: v1
          kind: ResourceQuota
          namespace: ""
          type: "objects"
          "elasticsearch.datastream": ""
          output: ""
          modifyValues: []
          excludeManagedFields: true
        "nodes":
          disabled: false
          refresh: 45m
          apiVersion: v1
          kind: Node
          namespace: ""
          type: "objects"
          "elasticsearch.datastream": ""
          output: ""
          modifyValues: []
          excludeManagedFields: true
        "deployments":
          disabled: false
          refresh: 45m
          apiVersion: apps/v1
          kind: deployment
          namespace: ""
          type: "objects"
          "elasticsearch.datastream": ""
          output: ""
          modifyValues: []
          excludeManagedFields: true
