            - '^etcd_server_go_version$'
            - '^etcd_server_id$'
            - '^etcd_network_peer_round_trip_time_seconds_sum$'
          blacklist: []
          # Most gRPC method and code series stay 0: send each once it first rises.
          skipZeroCounters:
