scc:
  create: true
  name: ""
  
collectord:
  image:
    repository: registry.outcold.solutions/outcoldsolutions/collectorforopenshift
    # Docker Hub: docker.io/outcoldsolutions/collectorforopenshift
    # Red Hat certified image: registry.connect.redhat.com/outcoldsolutions/collectorforopenshift

  environment: openshift

  # The master label: masters installed before 4.12 may lack the control-plane one.
  controlPlaneNodeSelector: node-role.kubernetes.io/master

  clusterRole:
    name: ""
    create: true
    rules:
    - apiGroups:
      - apps.openshift.io
      resources:
      - deploymentconfigs
      verbs:
      - get
      - list
      - watch
    - apiGroups:
      - quota.openshift.io
      resources:
      - clusterresourcequotas
      verbs:
      - get
      - list
      - watch

  # Liveness/readiness probes on /healthz and /readyz, at configuration.general's
  # httpServerBinding port; set httpGet.port when a configMap file sets the binding.
  daemonset:
    livenessProbe:
      httpGet:
        host: 127.0.0.1
        path: /healthz
      initialDelaySeconds: 120
      periodSeconds: 60
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        host: 127.0.0.1
        path: /readyz
      initialDelaySeconds: 10
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
  deployment:
    livenessProbe:
      httpGet:
        path: /healthz
      initialDelaySeconds: 120
      periodSeconds: 60
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /readyz
      initialDelaySeconds: 10
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3

  configuration:
    general:
      # IMPORTANT: Please review license https://www.outcoldsolutions.com/legal/license-agreement/
      # and accept license by changing the value to *true*
      acceptLicense: false
      license: ""
      dataPath: "./data/"
      logLevel: info
      httpServerBinding: "127.0.0.1:11888"
      "httpServerEndpoints.health": true
      "httpServerEndpoints.ready": true
      "httpServerEndpoints.metrics": false
      "httpServerEndpoints.pprof": false
      httpServerLog: false
      telemetryEndpoint: "https://license.outcold.solutions/telemetry/"
      licenseEndpoint: "https://license.outcold.solutions/license/"
      licenseServerProxyUrl: ""
      licenseServerProxyBasicAuth: ""
      hostname: ""
      defaultOutput: "splunk"
      defaultIndexType: events
      fileInputBufferSize: "8kb"
      fileInputLineMaxSize: "1mb"
      fields:
        openshift_cluster: "-"
      ec2Metadata: {}
      annotationsSubdomain: ""
      thruputPerSecond: ""
      tooOldEvents: ""
      tooNewEvents: ""
      fieldsSeparator: ""
      autoSkipGzipFiles: true
      "multioutput.async": true
      "multioutput.asyncBufferSize": 100
      kubernetes:
        serviceURL: ""
        nodeName: ""
        tokenPath: /var/run/secrets/kubernetes.io/serviceaccount/token
        certPath: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        timeout: 30m
        metadataTTL: 30s
        volumesRootDir: /rootfs/var/lib/kubelet/
        includeAnnotations: []
        excludeLabels: []
        crossNamespaceUserOutputs: false
        # Not DeploymentConfigs (deprecated since 4.14); a pod's DeploymentConfig is still its owner.
        watch:
          - 'v1/namespace'
          - 'apps/v1/deployment'
          - 'collectord.io/v1/configuration'
      crio:
        url: unix:///rootfs/var/run/crio/crio.sock
        timeout: 1m
    licenseClient:
      url: ""
      basicAuth: ""
      insecure: false
      capath: ""
      caname: ""
      proxyUrl: ""
      proxyBasicAuth: ""
    pipeJoin:
      disabled: false
      maxInterval: 100ms
      maxWait: 1s
      maxSize: 1MB
      patternRegex: '^[^\s]'
    pipeReplace: []
    pipeHash: []
    # Log lines no thruput cap holds back and no sampling drops, per workload; over a spent cap
    # a selected workload drops its other lines. Select by openshift_namespace: pod, container
    # and image names are the workload owner's to choose.
    # - name: payments-audit
    #   patternRegex: '^AUDIT'
    #   matchRegex:
    #     openshift_namespace: '^payments$'
    pipeThruputExempt: []
    pipeEventCount:
      disabled: true
      labels: []
      fields: []
      maxSeries: 0
  
    outputs:
      splunk:
        default:
          url: ""
          urls: []
          urlSelection: random
          token: ""
          insecure: false
          minTLSVersion: ""
          maxTLSVersion: ""
          caPath: ""
          caName: ""
          clientCertPath: ""
          clientKeyPath: ""
          frequency: 5s
          batchSize: 768K
          events: 50
          proxyUrl: ""
          proxyBasicAuth: ""
          ackUrl: ""
          ackUrls: []
          ackEnabled: false
          ackTimeout: 3m
          timeout: 30s
          idleConnTimeout: 5m
          dedicatedClientPerIndex: true
          incorrectIndexBehavior: RedirectToDefault
          compressionLevel: default
          threads: 2
          threadsAlgorithm: weighted
          maxConnsPerHost:
          excludeFields: []
          duplicateFieldsWithUnderscore: false
          requireExplicitIndex: false
          defaultMetricsIndex: ""
          maximumMessageLength: ""
          includeEventID: false
          queueSize: 1024
          timestampPrecision:
  
    inputs:
      collectordMetrics:
        disabled: false
        type: "openshift_prometheus"
        interval: 1m
        output: ""
        index: ""
        metricsIndex: ""
        metricsOutput: ""
        whitelist:
        - "^file_input_open$"
        - "^file_input_read_bytes$"
        - "^openshift_handlers$"
        - "^pipe$"
        - "^pipelines_num$"
        - "^splunk_post_bytes_sum.*$"
        - "^splunk_post_events_count_sum.*$"
        - "^splunk_post_failed_requests$"
        - "^splunk_post_message_max_lag_seconds_bucket.*$"
        - "^splunk_post_requests_seconds_sum.*$"
        - "^splunk_post_retries_required_sum.*$"
        blacklist: []
    
      prometheusAuto:
        disabled: false
        type: "openshift_prometheus"
        index: ""
        metricsIndex: ""
        metricsOutput: ""
        interval: 60s
        includeHelp: true
        timeout: 30s
        output: ""
        authorization: []
    
      systemStats:
        disabled:
          host: false
          cgroup: false
        pathCgroups: /rootfs/sys/fs/cgroup
        pathProc: /rootfs/proc
        statsInterval: 30s
        type:
          host: "openshift_stats_v2_host"
          cgroup: "openshift_stats_v2_cgroup"
        index:
          host: ""
          cgroup: ""
        metricsIndex:
          host: ""
          cgroup: ""
        metricsOutput:
          host: ""
          cgroup: ""
        output:
          host: ""
          cgroup: ""
      
      procStats:
        disabled: false
        pathProc: /rootfs/proc
        statsInterval: 30s
        type: "openshift_proc_stats_v2"
        index:
          host: ""
          cgroup: ""
        metricsIndex: ""
        metricsOutput: ""
        includeSystemThreads: false
        output:
          host: ""
          cgroup: ""
        hideArgs: false
        
      netStats:
        disabled: false
        pathProc: /rootfs/proc
        statsInterval: 30s
        type: "openshift_net_stats_v2"
        index:
          host: ""
          cgroup: ""
        metricsIndex:
          host: ""
          cgroup: ""
        metricsOutput:
          host: ""
          cgroup: ""
        output:
          host: ""
          cgroup: ""
      
      netSocketTable:
        disabled: false
        pathProc: /rootfs/proc
        statsInterval: 30s
        type: "openshift_net_socket_table"
        index:
          host: ""
          cgroup: ""
        output:
          host: ""
          cgroup: ""
        group: true
        disableLookup: false
        
      mountStats:
        disabled: false
        statsInterval: 30s
        # root: the kubelet's filesystem; auto: every real filesystem of the node, filtered by
        # include (filesystem type) and exclude (mount point) regular expressions.
        mounts: root
        include: ""
        exclude: ""
        type: "openshift_mount_stats"
        index: ""
        metricsIndex: ""
        metricsOutput: ""
        output: ""
      
      diskStats:
        disabled: false
        statsInterval: 30s
        type: "openshift_disk_stats"
        index: ""
        metricsIndex: ""
        metricsOutput: ""
        output: ""
        
      containerLogs:
        disabled: false
        type: "openshift_logs"
        path: "/rootfs/var/lib/docker/containers/"
        crioPath: "/rootfs/var/log/pods/"
        pollingInterval: 250ms
        walkingInterval: 5s
        verboseFields: false
        index: ""
        joinPartialEvents: true
        stripTerminalEscapeSequences: false
        stripTerminalEscapeSequencesRegex: '(\x1b\[\d{1,3}(;\d{1,3})*m)|(\x07)|(\x1b]\d+(\s\d)?;[^\x07]+\x07)|(.*\x1b\[K)'
        samplingPercent: -1
        samplingKey: ""
        output: ""
        thruputPerSecond: ""
        tooOldEvents: ""
        tooNewEvents: ""
        # Read rotated logs the kubelet compressed before Collectord got to them; false counts them lost.
        readCompressed: true
        compressedInflateBudget: 256MiB
        # Repeat grouping, folding (lossy) and pattern reports: off unless true here or in a
        # workload's logs-repeat/fold/patterns-enabled annotation.
        repeatEnabled: false
        foldEnabled: false
        patternsEnabled: false
        
      applicationLogs:
        disabled: false
        root: /rootfs/
        syncInterval: 5s
        glob: "*.log*"
        pollingInterval: 250ms
        walkingInterval: 5s
        verboseFields: false
        type: "openshift_logs"
        index: ""
        eventPatternRegex: '^[^\s]'
        eventPatternMaxInterval: 100ms
        eventPatternMaxWait: 1s
        eventPatternMaxSize: 1MB
        samplingPercent: -1
        samplingKey: ""
        output: ""
        thruputPerSecond: ""
        tooOldEvents: ""
        tooNewEvents: ""
        maxHoldAfterClose: 1800s
        repeatEnabled: false
        foldEnabled: false
        patternsEnabled: false

      # Audit logs of the control plane, read on the control-plane nodes only.
      hostLogs:
        "audit-logs":
          disabled: false
          controlPlaneOnly: true
          path: '/rootfs/var/log/kube-apiserver/'
          glob: 'audit*.log'
          match: ""
          recursive: false
          pollingInterval: 250ms
          walkingInterval: 5s
          verboseFields: false
          type: "openshift_host_logs"
          index: ""
          samplingPercent: -1
          samplingKey: ""
          extraction: '(?P<message>.*"stageTimestamp":"(?P<timestamp>[^"]+)".*)'
          extractionMessageField: 'message'
          timestampField: 'timestamp'
          timestampFormat: '2006-01-02T15:04:05.999999999Z07:00'
          timestampLocation: ""
          output: ""
          thruputPerSecond: ""
          tooOldEvents: ""
          tooNewEvents: ""
          eventPattern: ""
          blacklist: []
          whitelist: []
          thruputExempt: []
          repeatEnabled: false
          foldEnabled: false
          patternsEnabled: false
        "openshift-apiserver-audit-logs":
          disabled: false
          controlPlaneOnly: true
          path: '/rootfs/var/log/openshift-apiserver/'
          glob: 'audit*.log'
          match: ""
          recursive: false
          pollingInterval: 250ms
          walkingInterval: 5s
          verboseFields: false
          type: "openshift_host_logs"
          index: ""
          samplingPercent: -1
          samplingKey: ""
          extraction: '(?P<message>.*"stageTimestamp":"(?P<timestamp>[^"]+)".*)'
          extractionMessageField: 'message'
          timestampField: 'timestamp'
          timestampFormat: '2006-01-02T15:04:05.999999999Z07:00'
          timestampLocation: ""
          output: ""
          thruputPerSecond: ""
          tooOldEvents: ""
          tooNewEvents: ""
          eventPattern: ""
          blacklist: []
          whitelist: []
          thruputExempt: []
          repeatEnabled: false
          foldEnabled: false
          patternsEnabled: false
        "oauth-apiserver-audit-logs":
          disabled: false
          controlPlaneOnly: true
          path: '/rootfs/var/log/oauth-apiserver/'
          glob: 'audit*.log'
          match: ""
          recursive: false
          pollingInterval: 250ms
          walkingInterval: 5s
          verboseFields: false
          type: "openshift_host_logs"
          index: ""
          samplingPercent: -1
          samplingKey: ""
          extraction: '(?P<message>.*"stageTimestamp":"(?P<timestamp>[^"]+)".*)'
          extractionMessageField: 'message'
          timestampField: 'timestamp'
          timestampFormat: '2006-01-02T15:04:05.999999999Z07:00'
          timestampLocation: ""
          output: ""
          thruputPerSecond: ""
          tooOldEvents: ""
          tooNewEvents: ""
          eventPattern: ""
          blacklist: []
          whitelist: []
          thruputExempt: []
          repeatEnabled: false
          foldEnabled: false
          patternsEnabled: false
        "oauth-server-audit-logs":
          disabled: false
          controlPlaneOnly: true
          path: '/rootfs/var/log/oauth-server/'
          glob: 'audit*.log'
          match: ""
          recursive: false
          pollingInterval: 250ms
          walkingInterval: 5s
          verboseFields: false
          type: "openshift_host_logs"
          index: ""
          samplingPercent: -1
          samplingKey: ""
          extraction: '(?P<message>.*"stageTimestamp":"(?P<timestamp>[^"]+)".*)'
          extractionMessageField: 'message'
          timestampField: 'timestamp'
          timestampFormat: '2006-01-02T15:04:05.999999999Z07:00'
          timestampLocation: ""
          output: ""
          thruputPerSecond: ""
          tooOldEvents: ""
          tooNewEvents: ""
          eventPattern: ""
          blacklist: []
          whitelist: []
          thruputExempt: []
          repeatEnabled: false
          foldEnabled: false
          patternsEnabled: false

      journald:
        disabled: false
        path:
          persistent: /rootfs/var/log/journal/
        pollingInterval: 250ms
        startFromRel: ""
        type: "openshift_host_logs"
        index: ""
        samplingPercent: -1
        samplingKey: ""
        reopenInterval: 1h
        output: ""
        thruputPerSecond: ""
        tooOldEvents: ""
        tooNewEvents: ""
        eventPattern: '^[^\s]'
        blacklist:
          - '^I\d+.*$'
        whitelist: []
        thruputExempt: []
        spawnExternalProcess: false
        repeatEnabled: false
        foldEnabled: false
        patternsEnabled: false
        
      # Scripts run on every node, their output sent as events: each entry is an
      # [input.script::<name>] stanza (quote arg.<n> and env.<n>). root: /rootfs runs it with the
      # node's shell and tools. A script runs only when root owns it and every directory above it,
      # writable by no one else.
      scripts: {}
        # uptime:
        #   command: /opt/scripts/uptime.sh
        #   "arg.1": "--pretty"
        #   "env.1": "TZ=UTC"
        #   root: /rootfs
        #   user: nobody
        #   interval: 5m
        #   timeout: 60s
        #   format: event
        #   type: openshift_uptime

      diagnostics:
        # Collectord can report if node reboot is required (uncomment to use it)
        node-reboot-required:
          path: /rootfs/run/reboot-required*
          interval: "1h"
        # See https://www.kernel.org/doc/Documentation/admin-guide/hw-vuln/index.rst
        # And https://www.kernel.org/doc/Documentation/ABI/testing/sysfs-devices-system-cpu
        cpu-vulnerabilities:
          path: /rootfs/sys/devices/system/cpu/vulnerabilities/*
          interval: 1h
          
      prometheus:
        # Each entry is an [input.prometheus::<name>] stanza, scraped by the DaemonSet on every node.
        #
        # The "WHERE" of the scrape is controlled by one of four keys:
        #   podSelector:   the pods on this node a label selector matches, in podNamespace,
        #                  at portName or port (podSelectors adds alternatives)
        #   endpointSlice: <svc>.<ns>  - per-pod fan-out via discovery.k8s.io/v1.EndpointSlice
        #   service:       <svc>.<ns>  - hit the ClusterIP, kube-proxy load-balances
        #   endpoint(s):   literal URL(s) - no Kubernetes discovery; the first that answers
        # When endpointSlice or service is used, set port (number) or portName
        # (matches EndpointSlice port name), plus scheme (http/https) and path.
        # Beside a podSelector, endpoint(s) are the fallback on a node without a matching pod,
        # limited to the nodes nodeSelector matches.
        #
        # Example - controller-manager reached through its Service:
        # "controller-via-discovery":
        #   nodeSelector: node-role.kubernetes.io/master
        #   disabled: false
        #   type: "openshift_prometheus"
        #   source: "controller"
        #   interval: "60s"
        #   timeout: "60s"
        #   endpointSlice: kube-controller-manager.openshift-kube-controller-manager
        #   port: 10257
        #   scheme: https
        #   path: /metrics
        #   tokenPath: /var/run/secrets/kubernetes.io/serviceaccount/token
        #   certPath: ""
        #   clientCertPath: ""
        #   clientKeyPath: ""
        #   insecure: true
        #   includeHelp: false
        "kubelet":
          disabled: false
          type: "openshift_prometheus"
          index: ""
          metricsIndex: ""
          metricsOutput: ""
          host: '${KUBERNETES_NODENAME}'
          source: "kubelet"
          interval: "60s"
          timeout: "60s"
          # The node IP, not loopback, which a host-network pod could bind to take the token.
          # To verify, point certPath at OpenShift's kubelet-serving CA and set insecure: false.
          endpoint: ""
          endpoints:
            - 'https://${KUBERNETES_NODEIP}:10250/metrics'
          tokenPath: "/var/run/secrets/kubernetes.io/serviceaccount/token"
          certPath: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          clientCertPath: ""
          clientKeyPath: ""
          insecure: true
          includeHelp: false
          output: ""
          whitelist:
            - '^(kubernetes|openshift)_build_info$'
            - '^kubelet_runtime_operations_duration_seconds_sum$'
            - '^kubelet_runtime_operations_errors_total$'
            - '^kubelet_cgroup_manager_duration_seconds_sum$'
            - '^storage_operation_duration_seconds_sum$'
            - '^kubelet_volume_stats_.+$'
            - '^kubelet_running_pods$'
            - '^kubelet_running_containers$'
            - '^kubelet_desired_pods$'
            - '^kubelet_pleg_relist_duration_seconds_sum$'
            - '^kubelet_pod_start_duration_seconds_sum$'
            - '^kubelet_pod_worker_duration_seconds_sum$'
            - '^kubelet_started_pods_errors_total$'
            - '^kubelet_certificate_manager_client_ttl_seconds$'
            - '^rest_client_requests_total$'
            - '^rest_client_request_duration_seconds_sum$'
            - '^process_cpu_seconds_total$'
            - '^process_resident_memory_bytes$'
            - '^process_virtual_memory_bytes$'
            - '^process_open_fds$'
            - '^process_max_fds$'
            - '^go_goroutines$'
            - '^process_start_time_seconds$'
          blacklist: []
        "kubernetes-api":
          disabled: false
          type: "openshift_prometheus"
          index: ""
          metricsIndex: ""
          metricsOutput: ""
          host: '${KUBERNETES_NODENAME}'
          source: "kubernetes-api"
          interval: "60s"
          timeout: "60s"
          podNamespace: openshift-kube-apiserver
          podSelector: app=openshift-kube-apiserver
          port: 6443
          scheme: https
          path: /metrics
          nodeSelector: node-role.kubernetes.io/master
          endpoint: ""
          endpoints:
            - "https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}/metrics"
          tokenPath: "/var/run/secrets/kubernetes.io/serviceaccount/token"
          certPath: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          caName: kubernetes
          clientCertPath: ""
          clientKeyPath: ""
          insecure: false
          includeHelp: false
          output: ""
          whitelist:
            - '^(kubernetes|openshift)_build_info$'
            - '^authenticated_user_requests$'
            - '^apiserver_request_total$'
            - '^apiserver_current_inflight_requests$'
            - '^apiserver_flowcontrol_current_inqueue_requests$'
            - '^apiserver_request_terminations_total$'
            - '^apiserver_client_certificate_expiration_seconds_bucket$'
            - '^apiserver_audit_event_total$'
            - '^apiserver_audit_error_total$'
            - '^apiserver_resource_objects$'
            - '^apiserver_storage_objects$'
            - '^process_cpu_seconds_total$'
            - '^process_resident_memory_bytes$'
            - '^process_virtual_memory_bytes$'
            - '^process_open_fds$'
            - '^process_max_fds$'
            - '^go_goroutines$'
            - '^process_start_time_seconds$'
            - '^apiserver_request_duration_seconds_sum$'
          blacklist: []
        "scheduler":
          disabled: false
          type: "openshift_prometheus"
          index: ""
          metricsIndex: ""
          metricsOutput: ""
          host: '${KUBERNETES_NODENAME}'
          source: "scheduler"
          interval: "60s"
          timeout: "60s"
          podNamespace: openshift-kube-scheduler
          podSelector: app=openshift-kube-scheduler
          port: 10259
          scheme: https
          path: /metrics
          nodeSelector: node-role.kubernetes.io/master
          endpoint: ""
          endpoints:
            - "https://127.0.0.1:10259/metrics"
          tokenPath: "/var/run/secrets/kubernetes.io/serviceaccount/token"
          certPath: "/var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt"
          caName: scheduler.openshift-kube-scheduler.svc
          clientCertPath: ""
          clientKeyPath: ""
          insecure: false
          includeHelp: false
          output: ""
          whitelist:
            - '^(kubernetes|openshift)_build_info$'
            - '^scheduler_scheduling_attempt_duration_seconds_sum$'
            - '^scheduler_scheduling_algorithm_duration_seconds_sum$'
            - '^scheduler_pending_pods$'
            - '^scheduler_schedule_attempts_total$'
            - '^scheduler_queue_incoming_pods_total$'
            - '^scheduler_preemption_attempts_total$'
            - '^leader_election_master_status$'
            - '^rest_client_requests_total$'
            - '^rest_client_request_duration_seconds_sum$'
            - '^process_cpu_seconds_total$'
            - '^process_resident_memory_bytes$'
            - '^process_virtual_memory_bytes$'
            - '^process_open_fds$'
            - '^process_max_fds$'
            - '^go_goroutines$'
            - '^process_start_time_seconds$'
          blacklist: []
        "controller":
          disabled: false
          type: "openshift_prometheus"
          index: ""
          metricsIndex: ""
          metricsOutput: ""
          host: '${KUBERNETES_NODENAME}'
          source: "controller"
          interval: "60s"
          timeout: "60s"
          podNamespace: openshift-kube-controller-manager
          podSelector: app=kube-controller-manager
          port: 10257
          scheme: https
          path: /metrics
          nodeSelector: node-role.kubernetes.io/master
          endpoint: ""
          endpoints:
            - "https://127.0.0.1:10257/metrics"
          tokenPath: "/var/run/secrets/kubernetes.io/serviceaccount/token"
          certPath: "/var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt"
          caName: kube-controller-manager.openshift-kube-controller-manager.svc
          clientCertPath: ""
          clientKeyPath: ""
          insecure: false
          includeHelp: false
          output: ""
          whitelist:
            - '^(kubernetes|openshift)_build_info$'
            - '^node_collector_zone_size$'
            - '^node_collector_zone_health$'
            - '^node_collector_unhealthy_nodes_in_zone$'
            - '^node_collector_evictions_total$'
            - '^workqueue_depth$'
            - '^workqueue_retries_total$'
            - '^workqueue_longest_running_processor_seconds$'
            - '^leader_election_master_status$'
            - '^rest_client_requests_total$'
            - '^rest_client_request_duration_seconds_sum$'
            - '^process_cpu_seconds_total$'
            - '^process_resident_memory_bytes$'
            - '^process_virtual_memory_bytes$'
            - '^process_open_fds$'
            - '^process_max_fds$'
            - '^go_goroutines$'
            - '^process_start_time_seconds$'
          blacklist: []
        "etcd":
          # etcd's metrics need a client certificate, read from the master's static-pod resources.
          nodeSelector: node-role.kubernetes.io/master
          disabled: false
          type: "openshift_prometheus"
          index: ""
          metricsIndex: ""
          metricsOutput: ""
          host: '${KUBERNETES_NODENAME}'
          source: "etcd"
          interval: "60s"
          timeout: "60s"
          endpoint: ""
          endpoints:
