{{- if .Values.clusterRole.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.clusterRole.name | default .Release.Name }}
  labels:
    {{- include "collectord.labels" . | nindent 4 }}
rules:
{{- toYaml .Values.clusterRole.baseRules | nindent 2 }}
{{- if .Values.clusterRole.userOutputSecrets }}
  # A SplunkOutput with spec.tokenFromSecret reads the one Secret it names.
  - apiGroups:
    - ""
    resources:
    - secrets
    verbs:
    - get
{{- end }}
{{- with .Values.clusterRole.rules }}
{{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
