{{- if .Values.deployment.create -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "collectord.workloadName" . }}-addon
  namespace: {{ .Release.Namespace }}
  {{- with .Values.deployment.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "collectord.workloadLabels" . | nindent 4 }}
    {{- with .Values.deployment.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "collectord.deployment.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      name: {{ include "collectord.workloadName" . }}-addon
      annotations:
        # A change to the configuration files these pods mount rolls them:
        # Collectord reads its inputs' configuration at startup. A ConfigMap managed
        # outside the chart (configMap.create: false) gets no checksum: roll the pods
        # with an annotation of your own under podAnnotations.
        {{- $checksum := include "collectord.configChecksum" (dict "root" $ "keys" (list "001-general.conf" "004-addon.conf") "extra" (list .Values.configMap.allAdditionalFiles .Values.configMap.deploymentAdditionalFiles)) }}
        {{- $podAnnotations := default (dict) .Values.deployment.podAnnotations }}
        {{- if $checksum }}
        checksum/config: {{ $checksum }}
        {{- $podAnnotations = omit $podAnnotations "checksum/config" }}
        {{- end }}
        {{- with $podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "collectord.deployment.selectorLabels" . | nindent 8 }}
        {{- with .Values.deployment.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      priorityClassName: {{ include "collectord.priorityClassName" (dict "root" $ "workload" "deployment") | quote }}
      {{- /* a presence test, not `with`: 0 is a valid grace period and `with` would drop it */}}
      {{- if not (kindIs "invalid" .Values.deployment.terminationGracePeriodSeconds) }}
      terminationGracePeriodSeconds: {{ .Values.deployment.terminationGracePeriodSeconds }}
      {{- end }}
      serviceAccountName: {{ .Values.serviceAccount.name | default .Release.Name }}
      {{- with .Values.deployment.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with include "collectord.affinity" (dict "affinity" .Values.deployment.affinity "exclude" .Values.excludeNodes) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with .Values.deployment.tolerations }}
      tolerations:
        {{- toYaml . | nindent 6 }}
      {{- end }}
      containers:
      - name: {{ .Release.Name }}
        image: {{ include "collectord.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- with .Values.deployment.ports }}
        ports:
          {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.deployment.livenessProbe }}
        livenessProbe:
          {{- include "collectord.probe" (dict "probe" . "binding" $.Values.configuration.general.httpServerBinding) | nindent 10 }}
        {{- end }}
        {{- with .Values.deployment.readinessProbe }}
        readinessProbe:
          {{- include "collectord.probe" (dict "probe" . "binding" $.Values.configuration.general.httpServerBinding) | nindent 10 }}
        {{- end }}
        securityContext:
          {{- toYaml .Values.deployment.securityContext | nindent 10 }}
        resources:
          {{- toYaml .Values.deployment.resources | nindent 10 }}
        env:
        - name: KUBERNETES_NODENAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        {{- with .Values.deployment.env }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        volumeMounts:
        - name: {{ .Release.Name }}-state
          mountPath: /data
        - name: {{ .Release.Name }}-config
          mountPath: /config/
          readOnly: true
        {{- range $value := .Values.secrets }}
        - name: {{ $value.name }}
          mountPath: {{ $value.mountPath | default (printf "/config/%s" $value.name) }}
          readOnly: true
        {{- end }}
        {{- if .Values.mountLocalTime }}
        - name: localtime
          mountPath: /etc/localtime
          readOnly: true
        {{- end }}
        {{- include "collectord.volumeMounts" (dict "workloadType" "deployment" "values" .Values) | nindent 8 }}
      volumes:
      # The DaemonSet pod on this node owns the directory and the database the
      # addon opens read-only. DirectoryOrCreate, so an addon scheduled first
      # mounts it too; Collectord waits for the DaemonSet to create the database.
      - name: {{ .Release.Name }}-state
        hostPath:
          path: /var/lib/{{ include "collectord.workloadName" . }}/data/
          type: DirectoryOrCreate
      {{- if .Values.mountLocalTime }}
      - name: localtime
        hostPath:
          path: /etc/localtime
      {{- end }}
      - name: {{ .Release.Name }}-config
        configMap:
          name: {{ include "collectord.workloadName" . }}
          items:
          - key: 001-general.conf
            path: 001-general.conf
          - key: 004-addon.conf
            path: 004-addon.conf
          {{- range $filename, $content := .Values.configMap.allAdditionalFiles }}
          - key: {{ $filename }}
            path: {{ $filename }}
          {{- end }}
          {{- range $filename, $content := .Values.configMap.deploymentAdditionalFiles }}
          - key: {{ $filename }}
            path: {{ $filename }}
          {{- end }}
      {{- range $value := .Values.secrets }}
      - name: {{ $value.name }}
        secret:
          secretName: {{ $value.name }}
      {{- end }}
      {{- include "collectord.volumes" (dict "workloadType" "deployment" "values" .Values) | nindent 6 }}
{{- end -}}