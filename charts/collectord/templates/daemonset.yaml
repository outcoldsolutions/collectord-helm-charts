{{- if .Values.daemonset.create -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "collectord.workloadName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.daemonset.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "collectord.workloadLabels" . | nindent 4 }}
    {{- with .Values.daemonset.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "collectord.daemonset.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      name: {{ include "collectord.workloadName" . }}
      annotations:
        # A change to the configuration files these pods mount rolls them:
        # Collectord reads its inputs' configuration at startup. A ConfigMap managed
        # outside the chart (configMap.create: false) gets no checksum: roll the pods
        # with an annotation of your own under podAnnotations.
        {{- $checksum := include "collectord.configChecksum" (dict "root" $ "keys" (list "001-general.conf" "002-daemonset.conf") "extra" (list .Values.configMap.allAdditionalFiles .Values.configMap.daemonsetAdditionalFiles)) }}
        {{- $podAnnotations := default (dict) .Values.daemonset.podAnnotations }}
        {{- if $checksum }}
        checksum/config: {{ $checksum }}
        {{- $podAnnotations = omit $podAnnotations "checksum/config" }}
        {{- end }}
        {{- with $podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "collectord.daemonset.selectorLabels" . | nindent 8 }}
        {{- with .Values.daemonset.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      priorityClassName: {{ include "collectord.priorityClassName" (dict "root" $ "workload" "daemonset") | quote }}
      {{- /* a presence test, not `with`: 0 is a valid grace period and `with` would drop it */}}
      {{- if not (kindIs "invalid" .Values.daemonset.terminationGracePeriodSeconds) }}
      terminationGracePeriodSeconds: {{ .Values.daemonset.terminationGracePeriodSeconds }}
      {{- end }}
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      serviceAccountName: {{ .Values.serviceAccount.name | default .Release.Name }}
      {{- with .Values.daemonset.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with include "collectord.affinity" (dict "affinity" .Values.daemonset.affinity "exclude" .Values.excludeNodes) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with .Values.daemonset.tolerations }}
      tolerations:
        {{- toYaml . | nindent 6 }}
      {{- end }}
      containers:
      - name: {{ .Release.Name }}
        image: {{ include "collectord.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- with .Values.daemonset.ports }}
        ports:
          {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.daemonset.livenessProbe }}
        livenessProbe:
          {{- include "collectord.probe" (dict "probe" . "binding" $.Values.configuration.general.httpServerBinding) | nindent 10 }}
        {{- end }}
        {{- with .Values.daemonset.readinessProbe }}
        readinessProbe:
          {{- include "collectord.probe" (dict "probe" . "binding" $.Values.configuration.general.httpServerBinding) | nindent 10 }}
        {{- end }}
        securityContext:
          runAsUser: 0
          privileged: true
        resources:
          {{- toYaml .Values.daemonset.resources | nindent 10 }}
        env:
        - name: KUBERNETES_NODENAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: KUBERNETES_NODEIP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        {{- with .Values.daemonset.env }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        volumeMounts:
        - name: {{ .Release.Name }}-state
          mountPath: /data
        - name: {{ .Release.Name }}-config
          mountPath: /config/
          readOnly: true
        {{- range $value := .Values.secrets }}
        - name: {{ $value.name }}
          mountPath: {{ $value.mountPath | default (printf "/config/%s" $value.name) }}
          readOnly: true
        {{- end }}
        - name: rootfs
          mountPath: /rootfs/
          readOnly: {{ .Values.mountRootfsAsReadOnly }}
          mountPropagation: HostToContainer
        {{- if .Values.mountLocalTime }}
        - name: localtime
          mountPath: /etc/localtime
          readOnly: true
        {{- end }}
        {{- include "collectord.volumeMounts" (dict "workloadType" "daemonset" "values" .Values) | nindent 8 }}
      volumes:
      - name: {{ .Release.Name }}-state
        hostPath:
          path: /var/lib/{{ include "collectord.workloadName" . }}/data/
          type: DirectoryOrCreate
      - name: rootfs
        hostPath:
          path: /
      {{- if .Values.mountLocalTime }}
      - name: localtime
        hostPath:
          path: /etc/localtime
      {{- end }}
      - name: {{ .Release.Name }}-config
        configMap:
          name: {{ include "collectord.workloadName" . }}
          items:
          - key: 001-general.conf
            path: 001-general.conf
          - key: 002-daemonset.conf
            path: 002-daemonset.conf
          {{- range $filename, $content := .Values.configMap.allAdditionalFiles }}
          - key: {{ $filename }}
            path: {{ $filename }}
          {{- end }}
          {{- range $filename, $content := .Values.configMap.daemonsetAdditionalFiles }}
          - key: {{ $filename }}
            path: {{ $filename }}
          {{- end }}
      {{- range $value := .Values.secrets }}
      - name: {{ $value.name }}
        secret:
          secretName: {{ $value.name }}
      {{- end }}
      {{- include "collectord.volumes" (dict "workloadType" "daemonset" "values" .Values) | nindent 6 }}
{{- end -}}