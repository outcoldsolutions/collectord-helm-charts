apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: splunkoutputs.collectord.io
spec:
  group: collectord.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                insecure:
                  type: boolean
                token:
                  type: string
                  description: "Plain token"
                tokenFromSecret:
                  type: object
                  description: "Reference to a Kubernetes Secret"
                  properties:
                    secret:
                      type: string
                    key:
                      type: string
                defaultMetricsIndex:
                  type: string
                  description: "Index of the metrics-index records sent through this output; empty for the token's default"
                incorrectIndexBehavior:
                  type: string
                  description: "What happens to a record the token refuses"
                  enum: ["RedirectToDefault", "Drop", "Retry"]
                requireExplicitIndex:
                  type: boolean
                  description: "Drop a record that carries no index instead of sending it to the token's default"
              oneOf:
                - required: ["token"]
                - required: ["tokenFromSecret"]
  scope: Namespaced
  names:
    listKind: SplunkOutputList
    plural: splunkoutputs
    singular: splunkoutput
    kind: SplunkOutput