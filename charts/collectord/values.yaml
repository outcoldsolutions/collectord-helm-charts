# Default values for collectord.
# This is a YAML-formatted file.
# Declare variables to be substituted into your templates.

# Common labels applied to all resources
commonLabels: {}
  # Example:
  # environment: production
  # team: platform
  # cost-center: engineering

# Image settings
image:
  # OpenShift: docker.io/outcoldsolutions/collectorforopenshift
  # Kubernetes: docker.io/outcoldsolutions/collectorforkubernetes
  # To use RHEL Certified Image for OpenShift, specify registry.connect.redhat.com/outcoldsolutions/collectorforopenshift
  repository: docker.io/outcoldsolutions/collectorforkubernetes
  tag: "26.04.3"
  pullPolicy: Always

# Service Account
serviceAccount:
  name: ""
  create: true

# Priority Class
priorityClass:
  name: ""
  create: true
  value: 1000000000

# RBAC settings
clusterRole:
  name: ""
  create: true
  rules:
  # - apiGroups:
    #   - ''
    #   resources:
    #   - 'pods'
    #   - 'nodes'
    #   verbs:
    #   - 'get'
    #   - 'list'
    #   - 'watch'

# ConfigMap settings
configMap:
  create: true
  # Additional files to be added to the ConfigMap
  # Example:
  # daemonsetAdditionalFiles:
  #   "my-template.json": |
  #     {
  #       "key": "value"
  #     }
  daemonsetAdditionalFiles: {}
  daemonsetMasterAdditionalFiles: {}
  deploymentAdditionalFiles: {}

# Volume mounts for CA certificates and other files
volumeMounts:
  # Example for CA certificates:
  # - name: ca-certificates
  #   mountPath: /etc/ssl/certs/ca-bundle.crt
  #   subPath: ca-bundle.crt
  #   configMap:
  #     name: ca-certificates
  #   secret: {}  # Use either configMap or secret, not both
  # - name: custom-config
  #   mountPath: /config/custom
  #   secret:
  #     secretName: custom-config
  daemonset: []
  daemonsetMaster: []
  deployment: []

# Projected volumes for advanced configuration scenarios
projectedVolumes:
  # Example:
  # - name: combined-config
  #   mountPath: /config/projected
  #   sources:
  #     - configMap:
  #         name: config1
  #         items:
  #           - key: config.yaml
  #             path: config1.yaml
  #     - secret:
  #         name: secret1
  #         items:
  #           - key: password
  #             path: password.txt
  daemonset: []
  daemonsetMaster: []
  deployment: []
    
mountLocalTime: true
mountRootfsAsReadOnly: false
    
# DaemonSet configuration for worker nodes
daemonset:
  create: true

  # Workload-level annotations and labels (applied to DaemonSet resource)
  annotations: {}
    # Example:
    # deployment.kubernetes.io/revision: "1"
  
  labels: {}
    # Example:
    # component: "collector"
    # tier: "monitoring"

  # Pod selector labels (used for matchLabels in selector)
  # These labels will be automatically applied to pods as well
  selectorLabels: {}
    # Example:
    # app.kubernetes.io/component: worker
    # app.kubernetes.io/part-of: collectord

  # Pod-level annotations and labels (applied to pod template)
  podAnnotations: {}
    # Example:
    # prometheus.io/scrape: "true"
    # prometheus.io/port: "9090"
  
  podLabels: {}
    # Example:
    # version: "v1.0.0"
    # environment: "production"
  
  resources:
    limits:
      cpu: 2000m
      memory: 1024Mi
    requests:
      cpu: 500m
      memory: 256Mi

  # Affinity for daemonset pods
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: node-role.kubernetes.io/control-plane
            operator: DoesNotExist

  # Tolerations for daemonset pods
  tolerations:
  - operator: "Exists"
    effect: "NoSchedule"
  - operator: "Exists"
    effect: "NoExecute"

# DaemonSet configuration for master nodes
daemonsetMaster:
  create: true

  # Workload-level annotations and labels (applied to DaemonSet resource)
  annotations: {}
    # Example:
    # deployment.kubernetes.io/revision: "1"
  
  labels: {}
    # Example:
    # component: "collector-master"
    # tier: "monitoring"

  # Pod selector labels (used for matchLabels in selector)
  # These labels will be automatically applied to pods as well
  selectorLabels: {}
    # Example:
    # app.kubernetes.io/component: master
    # app.kubernetes.io/part-of: collectord

  # Pod-level annotations and labels (applied to pod template)
  podAnnotations: {}
    # Example:
    # prometheus.io/scrape: "true"
    # prometheus.io/port: "9090"
  
  podLabels: {}
    # Example:
    # version: "v1.0.0"
    # environment: "production"
  
  # Resources
  resources:
    limits:
      cpu: 2000m
      memory: 1024Mi
    requests:
      cpu: 500m
      memory: 256Mi

  # Affinity for daemonset-master pods
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists

  # Tolerations for daemonset-master pods
  tolerations:
  - operator: "Exists"
    effect: "NoSchedule"
  - operator: "Exists"
    effect: "NoExecute"

# Deployment configuration for addon
deployment:
  create: true

  # Workload-level annotations and labels (applied to Deployment resource)
  annotations: {}
    # Example:
    # deployment.kubernetes.io/revision: "1"
  
  labels: {}
    # Example:
    # component: "collector-addon"
    # tier: "monitoring"

  # Pod selector labels (used for matchLabels in selector)
  # These labels will be automatically applied to pods as well
  selectorLabels: {}
    # Example:
    # app.kubernetes.io/component: addon
    # app.kubernetes.io/part-of: collectord

  # Pod-level annotations and labels (applied to pod template)
  podAnnotations: {}
    # Example:
    # prometheus.io/scrape: "true"
    # prometheus.io/port: "9090"
  
  podLabels: {}
    # Example:
    # version: "v1.0.0"
    # environment: "production"
  
  # Resources
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 64Mi

configuration:
  general: {}
  inputs: {}
  outputs: {}
