          tokenPath: ""
          certPath: ""
          clientCertPath: ""
          clientKeyPath: ""
          insecure: false
          includeHelp: false
          output: ""
          whitelist:
            - '^etcd_server_leader_changes_seen_total$'
            - '^etcd_server_has_leader$'
            - '^etcd_server_is_leader$'
