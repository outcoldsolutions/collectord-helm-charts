        "etcd":
          disabled: false
          type: "kubernetes_prometheus"
          index: ""
          metricsIndex: ""
          metricsOutput: ""
          host: '${KUBERNETES_NODENAME}'
          source: "etcd"
          interval: "60s"
          timeout: "60s"
          # etcd's plain-HTTP metrics port. Its client port 2379 needs a client certificate
          # (under /rootfs), which also grants full access to etcd's data.
          podNamespace: kube-system
          podSelector: component=etcd
          portName: probe-port
          port: 2381
          scheme: http
          path: /metrics
          nodeSelector: node-role.kubernetes.io/control-plane
          endpoint: ""
          endpoints:
